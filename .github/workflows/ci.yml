name: CI

on:
  # CI runs on PRs (the merge gate) and on pushes to the long-lived branches
  # only — NOT on every feature-branch commit. A feature branch gets its CI
  # through the PR it opens (pull_request: opened/synchronize), so intermediate
  # work-in-progress commits no longer each spawn a (often red) CI run.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: 6.3.3
  SWIFTLY_VERSION: 1.1.3
  SWIFTLY_SIGNING_FINGERPRINT: E813C892820A6FA13755B268F167DF1ACF9CE069

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos-tests: ${{ steps.macos-tests.outputs.macos-tests }}
      macos-tests-deferred: ${{ steps.macos-tests.outputs.macos-tests-deferred }}
      macos-tests-reason: ${{ steps.macos-tests.outputs.macos-tests-reason }}
      changed-path-count: ${{ steps.macos-tests.outputs.changed-path-count }}
      macos-test-filter: ${{ steps.macos-tests.outputs.macos-test-filter }}
      macos-shard-indexes: ${{ steps.macos-tests.outputs.macos-shard-indexes }}
      ios-tests: ${{ steps.ios-tests.outputs.ios-tests }}
      ios-tests-reason: ${{ steps.ios-tests.outputs.ios-tests-reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collect changed paths
        id: changed-paths
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          changed_paths="${RUNNER_TEMP}/changed-paths.txt"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            git ls-files | awk '{ print "A\t" $0 }' > "$changed_paths"
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "Base commit ${base_sha} is unavailable; running macOS tests conservatively."
            git ls-files | awk '{ print "A\t" $0 }' > "$changed_paths"
          else
            git diff --name-status "$base_sha" "$GITHUB_SHA" > "$changed_paths"
          fi

          printf 'Changed paths:\n'
          sed 's/^/- /' "$changed_paths"
          echo "changed-paths=$changed_paths" >> "$GITHUB_OUTPUT"

      - name: Detect macOS test impact
        id: macos-tests
        shell: bash
        env:
          CI_PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          set -euo pipefail
          ./Scripts/ci_macos_test_gate.sh "${{ steps.changed-paths.outputs.changed-paths }}"

      - name: Detect iOS test impact
        id: ios-tests
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/ci_ios_test_gate.sh "${{ steps.changed-paths.outputs.changed-paths }}"

      - name: Summarize CI path gates
        if: ${{ always() }}
        shell: bash
        env:
          MACOS_TESTS: ${{ steps.macos-tests.outputs.macos-tests }}
          MACOS_TESTS_REASON: ${{ steps.macos-tests.outputs.macos-tests-reason }}
          CHANGED_PATH_COUNT: ${{ steps.macos-tests.outputs.changed-path-count }}
          MACOS_TEST_FILTER: ${{ steps.macos-tests.outputs.macos-test-filter }}
        run: |
          set -euo pipefail
          reason="${MACOS_TESTS_REASON:-<unset>}"
          reason="${reason//|/\\|}"
          {
            printf '### CI path gates\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| macOS Swift tests required | `%s` |\n' "${MACOS_TESTS:-<unset>}"
            printf '| macOS reason | %s |\n' "$reason"
            printf '| macOS focused suites | `%s` |\n' "${MACOS_TEST_FILTER:-<full suite or skipped>}"
            printf '| Changed path entries | `%s` |\n' "${CHANGED_PATH_COUNT:-<unset>}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize iOS test gate
        if: ${{ always() }}
        shell: bash
        env:
          IOS_TESTS: ${{ steps.ios-tests.outputs.ios-tests }}
          IOS_TESTS_REASON: ${{ steps.ios-tests.outputs.ios-tests-reason }}
          CHANGED_PATH_COUNT: ${{ steps.ios-tests.outputs.changed-path-count }}
        run: |
          set -euo pipefail
          reason="${IOS_TESTS_REASON:-<unset>}"
          reason="${reason//|/\\|}"
          {
            printf '### iOS test gate\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| iOS simulator tests required | `%s` |\n' "${IOS_TESTS:-<unset>}"
            printf '| Reason | %s |\n' "$reason"
            printf '| Changed path entries | `%s` |\n' "${CHANGED_PATH_COUNT:-<unset>}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set parser lint base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            base="origin/${{ github.event.repository.default_branch }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            base="origin/${{ github.event.repository.default_branch }}"
          else
            base="${{ github.event.before }}"
          fi
          echo "PARSER_LINT_BASE=$base" >> "$GITHUB_ENV"
          echo "Parser lint base: $base"

      - name: Install lint tools
        run: ./Scripts/install_lint_tools.sh

      - name: Lint
        run: ./Scripts/lint.sh lint

  swift-test-macos:
    needs: changes
    if: ${{ needs.changes.outputs.macos-tests == 'true' && needs.changes.outputs.macos-tests-deferred != 'true' }}
    # Apple-Silicon runners: ~2-4x faster Swift builds than the retired-path
    # Intel pool and much shorter queues (see #2585 for the measurements).
    runs-on: macos-26
    # Keep QuotaKit's larger-suite budget while individual suite timeouts
    # still catch hangs inside each shard.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        # Four shards keep the broad integration suite clear of the Swift Test timeout.
        shard-index: ${{ fromJSON(needs.changes.outputs.macos-shard-indexes) }}
        shard-count: [4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history so `lint.sh audit_parser_version` can compare against
        # the event-specific base selected below. A shallow (depth-1) checkout
        # makes the parser-version audit false-fail on parser changes because
        # it can't see the parserLogicVersion bump in the diff.
        with:
          fetch-depth: 0

      - name: Select Xcode 26.3 or 26.2
        run: |
          set -euo pipefail
          # Both versions are part of the official macOS 26 runner image.
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 26.* ]]
          /usr/bin/xcodebuild -version

      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # Keyed on dependency state: saves once per Package.resolved change,
          # and partial hits (restore-keys) still carry the dependency builds,
          # which dominate the cold-build time.
          key: swiftpm-macos26-arm64-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-macos26-arm64-

      - name: Swift toolchain version
        run: |
          set -euo pipefail
          swift --version
          swift package --version

      - name: Swift Test
        id: swift_test
        if: ${{ needs.changes.outputs.macos-test-filter == '' }}
        # Keep small suite batches so a hung suite fails its shard while avoiding one SwiftPM process per suite.
        timeout-minutes: 50
        run: |
          CODEXBAR_TEST_GROUP_SIZE=4 \
            CODEXBAR_TEST_SUITE_TIMEOUT=120 \
            CODEXBAR_TEST_RETRY_NON_TIMEOUT_FAILURES=0 \
            CODEXBAR_TEST_KEEP_GOING=1 \
            CODEXBAR_TEST_SHARD_INDEX=${{ matrix.shard-index }} \
            CODEXBAR_TEST_SHARD_COUNT=${{ matrix.shard-count }} \
            ./Scripts/test.sh

      - name: Focused Swift Test
        id: focused_swift_test
        if: ${{ needs.changes.outputs.macos-test-filter != '' }}
        timeout-minutes: 20
        env:
          CODEXBAR_TEST_FILTER: ${{ needs.changes.outputs.macos-test-filter }}
          CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS: 1
        run: swift test --filter "$CODEXBAR_TEST_FILTER"

      - name: Diagnose failed macOS test process
        if: ${{ failure() && (steps.swift_test.outcome == 'failure' || steps.focused_swift_test.outcome == 'failure') }}
        timeout-minutes: 3
        shell: bash
        run: |
          export CODEXBAR_ALLOW_TEST_KEYCHAIN_ACCESS=0
          export CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS=1
          source Scripts/test_environment.sh
          python3 Scripts/ci_swift_test_crash_diagnostic.py

      - name: Provider plugin engine A/B goldens
        if: ${{ matrix.shard-index == 0 && needs.changes.outputs.macos-test-filter == '' }}
        run: ./Scripts/test-plugin-engines.sh

      - name: Summarize macOS shard
        if: ${{ always() }}
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard-index }}
          SHARD_COUNT: ${{ matrix.shard-count }}
          RUNS_LINT_MACOS: ${{ matrix.shard-index == 0 }}
        run: |
          set -euo pipefail
          display_shard_index=$((SHARD_INDEX + 1))
          xcode_version="$(/usr/bin/xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"
          {
            printf '### macOS Swift shard\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| Shard | `%s / %s` |\n' "$display_shard_index" "$SHARD_COUNT"
            printf '| Runner | `%s` |\n' "${RUNNER_NAME:-unknown}"
            printf '| Xcode | `%s` |\n' "${xcode_version:-unknown}"
            printf '| Runs lint-macos | `%s` |\n' "$RUNS_LINT_MACOS"
          } >> "$GITHUB_STEP_SUMMARY"

  ios-test:
    needs: changes
    if: ${{ needs.changes.outputs.ios-tests == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode with an available iOS simulator
        run: |
          set -euo pipefail
          selected_xcode=""
          for candidate in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.1.app; do
            if [[ ! -d "$candidate" ]]; then
              continue
            fi

            sudo xcode-select -s "${candidate}/Contents/Developer"
            if xcrun simctl list devices available | grep -q 'iPhone'; then
              selected_xcode="$candidate"
              break
            fi
          done

          if [[ -z "$selected_xcode" ]]; then
            echo "No installed Xcode has an available iPhone simulator." >&2
            xcrun simctl list devices available >&2 || true
            exit 1
          fi

          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          echo "DEVELOPER_DIR=${selected_xcode}/Contents/Developer" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_UDID=$simulator_id" >> "$GITHUB_ENV"
          /usr/bin/xcodebuild -version
          echo "Selected iOS simulator: $simulator_id"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          xcodegen_version="2.45.4"
          xcodegen_sha256="090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
          xcodegen_archive="$RUNNER_TEMP/xcodegen-$xcodegen_version.zip"
          xcodegen_root="$RUNNER_TEMP/xcodegen-$xcodegen_version"

          curl -fsSL \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$xcodegen_version/xcodegen.zip" \
            -o "$xcodegen_archive"
          echo "$xcodegen_sha256  $xcodegen_archive" | shasum -a 256 -c -
          mkdir -p "$xcodegen_root"
          unzip -q "$xcodegen_archive" -d "$xcodegen_root"
          echo "$xcodegen_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$xcodegen_root/xcodegen/bin/xcodegen" --version

      - name: Generate iOS Xcode project
        run: |
          set -euo pipefail
          (cd CodexBarMobile && xcodegen generate)
          git diff --exit-code -- CodexBarMobile/CodexBarMobile.xcodeproj

      - name: iOS simulator tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project CodexBarMobile/CodexBarMobile.xcodeproj \
            -scheme CodexBarMobile \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/CodexBarMobile.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS test result bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CodexBarMobile-xcresult
          path: ${{ runner.temp }}/CodexBarMobile.xcresult

  swift-build-macos-compatibility:
    needs: changes
    if: ${{ needs.changes.outputs.macos-tests == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_26.3.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "Xcode 26.3 is required for the macOS compatibility build." >&2
            exit 1
          fi
          sudo xcode-select -s "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 26.3* ]]
          /usr/bin/xcodebuild -version

      - name: Restore Xcode 26.3 compatibility build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-macos15-xcode26.3-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-macos15-xcode26.3-

      - name: Build tests with Xcode 26.3
        run: |
          set -euo pipefail
          swift --version
          swift build --build-tests

  build-linux-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
          - runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Swift ${{ env.SWIFT_VERSION }} via swiftly
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates gpg
          fi

          SWIFTLY_ARCH="$(uname -m)"
          SWIFTLY_ARCHIVE="$RUNNER_TEMP/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz"
          SWIFTLY_SIGNATURE="${SWIFTLY_ARCHIVE}.sig"
          SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          SWIFTLY_BIN_DIR="$HOME/.local/bin"
          SWIFT_GNUPGHOME="$(mktemp -d)"
          SWIFT_KEYS="$RUNNER_TEMP/swift-signing-keys.asc"
          POST_INSTALL_SCRIPT="$(mktemp)"

          mkdir -p "$SWIFTLY_BIN_DIR"
          chmod 700 "$SWIFT_GNUPGHOME"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz" -o "$SWIFTLY_ARCHIVE"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz.sig" -o "$SWIFTLY_SIGNATURE"
          curl -fsSL --compressed "https://www.swift.org/keys/all-keys.asc" -o "$SWIFT_KEYS"
          GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --import "$SWIFT_KEYS"
          SIGNATURE_STATUS="$(GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --status-fd=1 \
            --verify "$SWIFTLY_SIGNATURE" "$SWIFTLY_ARCHIVE" 2>&1)"
          printf '%s\n' "$SIGNATURE_STATUS"
          grep -Fq "[GNUPG:] VALIDSIG ${SWIFTLY_SIGNING_FINGERPRINT} " <<< "$SIGNATURE_STATUS"
          tar -xzf "$SWIFTLY_ARCHIVE" -C /tmp
          /tmp/swiftly init --assume-yes --skip-install

          . "$SWIFTLY_HOME_DIR/env.sh"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

          swiftly install "$SWIFT_VERSION" --use --assume-yes --verify --post-install-file "$POST_INSTALL_SCRIPT"
          if [[ -s "$POST_INSTALL_SCRIPT" ]]; then
            sudo apt-get update
            sudo bash "$POST_INSTALL_SCRIPT"
          fi

          hash -r
          swift --version

      - name: Install Linux SQLite headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build CLI and run portable Linux tests
        run: |
          set -euo pipefail
          swift build --product CodexBarCLI
          source Scripts/test_environment.sh
          swift test --filter CodexBarLinuxTests
          bin_dir="$(swift build --product CodexBarCLI --show-bin-path)"
          timeout 20 "$bin_dir/CodexBarCLI" --help >/dev/null

  lint-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - lint
      - swift-test-macos
      - swift-build-macos-compatibility
      - ios-test
      - build-linux-cli
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required CI jobs
        run: |
          ./Scripts/ci_verify_test_jobs.sh \
            "${{ needs.lint.result }}" \
            "${{ needs.changes.result }}" \
            "${{ needs.changes.outputs.macos-tests }}" \
            "${{ needs.swift-test-macos.result }}" \
            "${{ needs.changes.outputs.macos-tests-deferred }}" \
            "${{ needs.changes.outputs.ios-tests }}" \
            "${{ needs.ios-test.result }}" \
            "${{ needs.build-linux-cli.result }}" \
            "${{ needs.swift-build-macos-compatibility.result }}"

      - name: Summarize aggregate CI gate
        if: ${{ always() }}
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_TESTS: ${{ needs.changes.outputs.macos-tests }}
          MACOS_TESTS_REASON: ${{ needs.changes.outputs.macos-tests-reason }}
          MACOS_TEST_FILTER: ${{ needs.changes.outputs.macos-test-filter }}
          MACOS_RESULT: ${{ needs.swift-test-macos.result }}
          MACOS_TESTS_DEFERRED: ${{ needs.changes.outputs.macos-tests-deferred }}
          IOS_TESTS: ${{ needs.changes.outputs.ios-tests }}
          IOS_TESTS_REASON: ${{ needs.changes.outputs.ios-tests-reason }}
          IOS_RESULT: ${{ needs.ios-test.result }}
          LINUX_RESULT: ${{ needs.build-linux-cli.result }}
          MACOS_COMPATIBILITY_RESULT: ${{ needs.swift-build-macos-compatibility.result }}
        run: |
          set -euo pipefail
          macos_reason="${MACOS_TESTS_REASON:-<unset>}"
          macos_reason="${macos_reason//|/\\|}"
          ios_reason="${IOS_TESTS_REASON:-<unset>}"
          ios_reason="${ios_reason//|/\\|}"
          {
            printf '### Aggregate CI gate\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| lint result | `%s` |\n' "$LINT_RESULT"
            printf '| changes result | `%s` |\n' "$CHANGES_RESULT"
            printf '| macOS Swift tests required | `%s` |\n' "${MACOS_TESTS:-<unset>}"
            printf '| macOS Swift tests deferred | `%s` |\n' "${MACOS_TESTS_DEFERRED:-<unset>}"
            printf '| macOS gate reason | %s |\n' "$macos_reason"
            printf '| macOS focused suites | `%s` |\n' "${MACOS_TEST_FILTER:-<full suite or skipped>}"
            printf '| swift-test-macos result | `%s` |\n' "$MACOS_RESULT"
            printf '| Xcode 26.3 compatibility build result | `%s` |\n' "$MACOS_COMPATIBILITY_RESULT"
            printf '| build-linux-cli matrix result | `%s` |\n' "$LINUX_RESULT"
            printf '| iOS simulator tests required | `%s` |\n' "${IOS_TESTS:-<unset>}"
            printf '| iOS gate reason | %s |\n' "$ios_reason"
            printf '| ios-test result | `%s` |\n' "$IOS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
